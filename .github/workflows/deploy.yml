name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, laptop]
    defaults:
      run:
        working-directory: /home/codderg/apps/unyapper
    steps:
      - name: pull main
        run: |
          git fetch origin main
          # Hard-reset onto origin — .local/ (state.json) is gitignored and survives.
          git reset --hard origin/main
          git log -1 --oneline

      - name: retire legacy systemd unit (idempotent)
        run: |
          # First deploy after the docker cutover: stop the host `next start`
          # unit so its :3000 bind doesn't collide with the container.
          systemctl --user stop unyapper.service 2>/dev/null || true
          systemctl --user disable unyapper.service 2>/dev/null || true

      - name: build & up
        # nice/ionice keep the build from starving the runner's heartbeat.
        # Without them, `next build` pins CPU/IO and GitHub marks the runner
        # offline mid-job, killing the deploy.
        run: nice -n 19 ionice -c3 docker compose up -d --build --remove-orphans

      - name: prune dangling images
        run: docker image prune -f

      - name: health check
        run: |
          for i in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "up"; exit 0
            fi
            sleep 1
          done
          echo "did not come up in 60s" >&2
          docker compose ps
          docker compose logs --tail=80 unyapper
          exit 1
