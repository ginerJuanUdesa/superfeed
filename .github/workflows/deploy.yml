name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, laptop]
    # Run all steps in the directory the systemd unit serves from — the runner's
    # own workspace is a different tree, so building there deploys nothing.
    defaults:
      run:
        working-directory: /home/codderg/apps/unyapper
    steps:
      - name: pull main
        run: |
          git fetch origin main
          # Hard-reset onto origin — .local/ (state.json) is gitignored and survives.
          git reset --hard origin/main
          git log -1 --oneline

      - name: install deps
        run: npm ci

      - name: build
        run: npm run build

      - name: restart service
        run: systemctl --user restart unyapper.service

      - name: health check
        run: |
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "up"; exit 0
            fi
            sleep 1
          done
          echo "did not come up in 30s" >&2
          systemctl --user status unyapper.service --no-pager | tail -30
          exit 1
